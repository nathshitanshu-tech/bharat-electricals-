// ── PROFIT & LOSS ─────────────────────────────────────────────────────
function ProfitLoss({invoices,products}){
  const now=new Date();
  const year=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  const [selMonth,setSelMonth]=useState(null);

  const monthlyData=Array.from({length:12},(_,i)=>{
    const mIdx=(i+3)%12;
    const yr=i<9?year:year+1;
    const invs=invoices.filter(inv=>{const d=new Date(inv.date);return d.getMonth()===mIdx&&d.getFullYear()===yr;});
    const revenue=invs.reduce((s,i)=>s+i.subtotal,0);
    const gst=invs.reduce((s,i)=>s+i.totalGst,0);
    const cogs=invs.reduce((s,inv)=>s+inv.items.reduce((a,it)=>{const p=products.find(p=>p.name===it.name);return a+(p?.costPrice||0)*(+it.qty||0);},0),0);
    const grossProfit=revenue-cogs;
    const margin=revenue>0?(grossProfit/revenue)*100:0;
    return{label:MONTH_SHORT[mIdx],fullLabel:MONTH_NAMES[mIdx]+" "+yr,revenue,gst,cogs,grossProfit,margin,invoiceCount:invs.length,mIdx,yr};
  });

  const annual=monthlyData.reduce((a,m)=>({revenue:a.revenue+m.revenue,gst:a.gst+m.gst,cogs:a.cogs+m.cogs,grossProfit:a.grossProfit+m.grossProfit,invoiceCount:a.invoiceCount+m.invoiceCount}),{revenue:0,gst:0,cogs:0,grossProfit:0,invoiceCount:0});
  const annualMargin=annual.revenue>0?(annual.grossProfit/annual.revenue)*100:0;
  const maxRev=Math.max(...monthlyData.map(m=>Math.max(m.revenue,m.grossProfit<0?-m.grossProfit:m.grossProfit)),1);
  const selected=selMonth!==null?monthlyData[selMonth]:null;

  return(
    <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"16px 14px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <h2 style={{fontSize:18,fontWeight:700,color:C.text}}>📈 Profit & Loss</h2>
        <span style={{fontSize:12,color:C.muted,marginLeft:"auto"}}>FY {year}-{String(year+1).slice(2)}</span>
      </div>

      {/* Annual summary */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[
          {icon:"💰",label:"Total Revenue",val:`₹${fmt(annual.revenue)}`,color:C.navy},
          {icon:"📦",label:"Total COGS",val:`₹${fmt(annual.cogs)}`,color:C.purple},
          {icon:"✅",label:"Gross Profit",val:`₹${fmt(annual.grossProfit)}`,color:annual.grossProfit>=0?C.green:C.red},
          {icon:"📊",label:"Profit Margin",val:`${annualMargin.toFixed(1)}%`,color:annualMargin>20?C.green:annualMargin>10?C.saffron:C.red},
          {icon:"🏛",label:"GST Collected",val:`₹${fmt(annual.gst)}`,color:C.blue},
          {icon:"🧾",label:"Total Invoices",val:annual.invoiceCount,color:C.text},
        ].map(s=>(
          <Card key={s.label} style={{padding:"12px 14px",borderLeft:`4px solid ${s.color}`}}>
            <div style={{fontSize:18,marginBottom:4}}>{s.icon}</div>
            <div style={{fontSize:15,fontWeight:700,color:s.color}}>{s.val}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.label}</div>
          </Card>
        ))}
      </div>

      {/* Monthly chart */}
      <Card style={{padding:"14px 14px",marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Monthly Overview</div>
        <div style={{display:"flex",gap:2,alignItems:"flex-end",height:80,marginBottom:6}}>
          {monthlyData.map((m,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:1,cursor:"pointer"}} onClick={()=>setSelMonth(selMonth===i?null:i)}>
              <div style={{width:"80%",display:"flex",flexDirection:"column",gap:1,alignItems:"center",justifyContent:"flex-end",height:72}}>
                <div style={{width:"100%",background:m.grossProfit>=0?C.green:C.red,height:Math.max(2,m.revenue>0?(Math.abs(m.grossProfit)/maxRev*60):0),borderRadius:"3px 3px 0 0",opacity:selMonth===i?1:0.7}}/>
                <div style={{width:"100%",background:C.navy,height:Math.max(2,m.cogs/maxRev*60),borderRadius:"3px 3px 0 0",opacity:selMonth===i?1:0.5}}/>
              </div>
              <div style={{fontSize:8,color:selMonth===i?C.navy:C.muted,fontWeight:selMonth===i?700:400}}>{m.label}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:12,fontSize:10,color:C.muted,justifyContent:"center"}}>
          <span><span style={{display:"inline-block",width:8,height:8,background:C.navy,borderRadius:2,marginRight:3}}/>COGS</span>
          <span><span style={{display:"inline-block",width:8,height:8,background:C.green,borderRadius:2,marginRight:3}}/>Profit</span>
        </div>
      </Card>

      {/* Month detail */}
      {selected&&(
        <Card style={{padding:"14px 14px",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.navy}}>{selected.fullLabel} Detail</div>
          {[
            {label:"Revenue (ex-GST)",val:`₹${fmt(selected.revenue)}`,color:C.navy},
            {label:"Cost of Goods",val:`₹${fmt(selected.cogs)}`,color:C.purple},
            {label:"Gross Profit",val:`₹${fmt(selected.grossProfit)}`,color:selected.grossProfit>=0?C.green:C.red},
            {label:"Profit Margin",val:`${selected.margin.toFixed(1)}%`,color:selected.margin>20?C.green:selected.margin>10?C.saffron:C.red},
            {label:"GST Collected",val:`₹${fmt(selected.gst)}`,color:C.blue},
            {label:"Invoices",val:selected.invoiceCount,color:C.text},
          ].map(r=>(
            <div key={r.label} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
              <span style={{color:C.muted}}>{r.label}</span>
              <span style={{fontWeight:700,color:r.color}}>{r.val}</span>
            </div>
          ))}
        </Card>
      )}

      {/* Monthly table */}
      <Card style={{overflowX:"auto"}}>
        <div style={{minWidth:400,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr style={{background:"#faf8f4"}}>
              {["Month","Revenue","Profit","Margin","Bills"].map(h=>(
                <th key={h} style={{padding:"8px 10px",textAlign:h==="Month"?"left":"right",fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {monthlyData.map((m,i)=>(
                <tr key={i} style={{borderTop:`1px solid ${C.border}`,background:selMonth===i?"#f0f7ff":"#fff",cursor:"pointer"}} onClick={()=>setSelMonth(selMonth===i?null:i)}>
                  <td style={{padding:"8px 10px",fontSize:12,fontWeight:600}}>{m.fullLabel}</td>
                  <td style={{padding:"8px 10px",fontSize:12,textAlign:"right"}}>{m.revenue>0?`₹${fmt(m.revenue)}`:"—"}</td>
                  <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",fontWeight:600,color:m.grossProfit>=0?C.green:C.red}}>{m.revenue>0?`₹${fmt(m.grossProfit)}`:"—"}</td>
                  <td style={{padding:"8px 10px",fontSize:12,textAlign:"right"}}>{m.revenue>0?<Badge color={m.margin>20?C.green:m.margin>10?C.saffron:C.red} bg={m.margin>20?"#d1fae5":m.margin>10?"#fef3c7":"#fef2f2"}>{m.margin.toFixed(1)}%</Badge>:"—"}</td>
                  <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",color:C.muted}}>{m.invoiceCount||"—"}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{background:C.navy,color:"#fff"}}>
                <td style={{padding:"8px 10px",fontSize:12,fontWeight:700}}>FY Total</td>
                <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",fontWeight:700}}>₹{fmt(annual.revenue)}</td>
                <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",fontWeight:700,color:annual.grossProfit>=0?"#a7f3d0":"#fca5a5"}}>₹{fmt(annual.grossProfit)}</td>
                <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",fontWeight:700,color:"#fde68a"}}>{annualMargin.toFixed(1)}%</td>
                <td style={{padding:"8px 10px",fontSize:12,textAlign:"right"}}>{annual.invoiceCount}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </Card>
    </div>
  );
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────
function Settings({invoices,products,customers,expenses,saveInv,saveProd,saveCust,setView}){
  function exportBackup(){
    const data={version:4,exportedAt:new Date().toISOString(),invoices,products,customers,expenses};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`bharat-electricals-backup-${today()}.json`;
    a.click();URL.revokeObjectURL(url);
  }
  function importBackup(){
    const input=document.createElement("input");
    input.type="file";input.accept=".json";
    input.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(!data.invoices||!data.products){alert("Invalid backup file.");return;}
          if(!window.confirm(`Restore backup from ${data.exportedAt?.slice(0,10)||"unknown date"}?\n\nInvoices: ${data.invoices.length}\nProducts: ${data.products.length}\nCustomers: ${(data.customers||[]).length}\n\nThis will REPLACE all current data.`))return;
          saveInv(data.invoices||[]);
          saveProd(data.products||[]);
          saveCust(data.customers||[]);
          alert("✅ Backup restored!");
        }catch(err){alert("Failed to read backup file.");}
      };
      reader.readAsText(file);
    };
    input.click();
  }

  return(
    <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"16px 14px 80px"}}>
      <h2 style={{fontSize:18,fontWeight:700,color:C.text,marginBottom:16}}>⚙️ More</h2>

      {/* Quick Links */}
      <Card style={{padding:"16px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.navy}}>🔗 Quick Links</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Btn variant="ghost" onClick={()=>setView("products")}>🔌 Products</Btn>
          <Btn variant="ghost" onClick={()=>setView("customers")}>👥 Customers</Btn>
        </div>
      </Card>

      {/* Shop Info */}
      <Card style={{padding:"16px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.navy}}>🏪 Shop Information</div>
        {[
          {label:"Name",val:SHOP.name},
          {label:"GSTIN",val:SHOP.gstin},
          {label:"Address",val:SHOP.address},
          {label:"City",val:SHOP.city},
          {label:"Phones",val:SHOP.phones.join(", ")},
          {label:"State",val:`${SHOP.state} (${SHOP.stateCode})`},
        ].map(r=>(
          <div key={r.label} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
            <span style={{color:C.muted,fontWeight:500}}>{r.label}</span>
            <span style={{fontWeight:600,textAlign:"right",maxWidth:"60%"}}>{r.val}</span>
          </div>
        ))}
      </Card>

      {/* Data */}
      <Card style={{padding:"16px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:C.navy}}>💾 Data Management</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.5}}>
          All your data is stored on this device. Export a backup regularly to prevent data loss.
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Btn variant="navy" onClick={exportBackup}>💾 Export Backup</Btn>
          <Btn variant="ghost" onClick={importBackup}>📂 Restore Backup</Btn>
        </div>
        <div style={{marginTop:12,fontSize:12,color:C.muted}}>
          <div>📊 {invoices.length} invoices | 📦 {products.length} products | 👥 {customers.length} customers | 💸 {(expenses||[]).length} expenses</div>
        </div>
      </Card>

      {/* Install PWA */}
      <Card style={{padding:"16px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:8,color:C.navy}}>📱 Install as App (Homescreen)</div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:10}}>
          <b style={{color:C.text}}>Android:</b> Tap ⋮ menu → "Add to Home Screen" or "Install App"<br/>
          <b style={{color:C.text}}>iPhone/iPad:</b> Tap Share (□↑) → "Add to Home Screen"
        </div>
        <div style={{fontSize:12,color:C.green,fontWeight:600}}>✅ Works offline once installed!</div>
      </Card>
    </div>
  );
}

// ── EXPENSE TRACKER ───────────────────────────────────────────────────
function ExpensePage({expenses,saveExpenses}){
  const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({date:today(),category:"Purchase",amount:"",note:""});
  const [filterMonth,setFilterMonth]=useState(new Date().getMonth());
  const [filterYear,setFilterYear]=useState(new Date().getFullYear());
  const CATS=["Purchase","Rent","Salary","Electricity","Transport","Repair","Other"];

  const now=new Date();
  const months=Array.from({length:12},(_,i)=>({value:i,label:MONTH_NAMES[i]}));
  const years=[now.getFullYear()-1,now.getFullYear()];

  const filtered=expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===filterMonth&&d.getFullYear()===filterYear;})
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=filtered.reduce((s,e)=>s+(+e.amount||0),0);

  // Category breakdown
  const catTotals={};
  filtered.forEach(e=>{if(!catTotals[e.category])catTotals[e.category]=0;catTotals[e.category]+=+e.amount||0;});

  function addExpense(){
    if(!form.amount||!form.date){alert("Date and amount required.");return;}
    const newE={id:uid(),...form,amount:+form.amount,createdAt:new Date().toISOString()};
    saveExpenses([...expenses,newE]);
    setForm({date:today(),category:"Purchase",amount:"",note:""});
    setShowAdd(false);
  }
  function del(id){if(window.confirm("Delete this expense?"))saveExpenses(expenses.filter(e=>e.id!==id));}

  const CAT_COLORS={Purchase:C.purple,Rent:C.red,Salary:C.blue,Electricity:C.saffron,Transport:C.green,Repair:C.navy,Other:C.muted};

  return(
    <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"16px 14px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <h2 style={{fontSize:18,fontWeight:700,color:C.text}}>💸 Expenses</h2>
        <Btn small onClick={()=>setShowAdd(true)} style={{marginLeft:"auto"}}>+ Add</Btn>
      </div>

      {/* Month filter */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <select value={filterMonth} onChange={e=>setFilterMonth(+e.target.value)}
          style={{flex:2,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13,background:"#fff",outline:"none"}}>
          {months.map(m=><option key={m.value} value={m.value}>{m.label}</option>)}
        </select>
        <select value={filterYear} onChange={e=>setFilterYear(+e.target.value)}
          style={{flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13,background:"#fff",outline:"none"}}>
          {years.map(y=><option key={y}>{y}</option>)}
        </select>
      </div>

      {/* Total */}
      <div style={{background:`linear-gradient(135deg,${C.navy},${C.navyL})`,borderRadius:14,padding:"16px 18px",marginBottom:14,boxShadow:"0 4px 16px rgba(15,31,61,0.2)"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",fontWeight:600,letterSpacing:1,marginBottom:4}}>TOTAL EXPENSES — {MONTH_NAMES[filterMonth].toUpperCase()} {filterYear}</div>
        <div style={{fontSize:28,fontWeight:800,color:"#fff"}}>₹{fmt(total)}</div>
        <div style={{fontSize:12,color:C.saffronL,marginTop:2}}>{filtered.length} entries</div>
      </div>

      {/* Category breakdown */}
      {Object.keys(catTotals).length>0&&(
        <Card style={{padding:"12px 14px",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:C.navy}}>By Category</div>
          {Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(

              <div style={{width:60,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",background:CAT_COLORS[cat]||C.muted,width:`${(amt/total*100)}%`,borderRadius:3}}/>
              </div>
            </div>
          ))}
        </Card>
      )}

      {/* List */}
      {filtered.length===0
        ?<div style={{textAlign:"center",color:C.muted,padding:40}}>
            <div style={{fontSize:32,marginBottom:8}}>💸</div>
            <div style={{fontSize:13}}>No expenses this month</div>
          </div>
        :filtered.map(e=>(
          <Card key={e.id} style={{padding:"12px 14px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <span style={{background:(CAT_COLORS[e.category]||C.muted)+"18",color:CAT_COLORS[e.category]||C.muted,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10}}>{e.category}</span>
                  <span style={{fontSize:11,color:C.muted}}>{new Date(e.date).toLocaleDateString("en-IN")}</span>
                </div>
                {e.note&&<div style={{fontSize:13,color:C.text}}>{e.note}</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontWeight:800,fontSize:15,color:C.red}}>₹{fmt(e.amount)}</div>
                <button onClick={()=>del(e.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:15}}>🗑</button>
              </div>

        ))
      }

      {showAdd&&(
        <Modal title="➕ Add Expense" onClose={()=>setShowAdd(false)}>
          <div style={{display:"grid",gap:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><Label>Date</Label><Input value={form.date} onChange={v=>setForm(f=>({...f,date:v}))} type="date"/></div>
              <div><Label>Amount ₹</Label><Input value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} type="number" placeholder="0" autoFocus/></div>
            </div>
            <div>
              <Label>Category</Label>
              <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
                style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 10px",fontSize:14,background:"#fff",outline:"none"}}>
                {CATS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div><Label>Note (optional)</Label><Input value={form.note} onChange={v=>setForm(f=>({...f,note:v}))} placeholder="e.g. Paid rent to landlord"/></div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <Btn variant="ghost" onClick={()=>setShowAdd(false)} style={{flex:1}}>Cancel</Btn>
            <Btn variant="primary" onClick={addExpense} style={{flex:1}}>💾 Save</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── KHATA / LEDGER PAGE ───────────────────────────────────────────────
function KhataPage({customers,invoices,saveInvoices}){
  const [selCust,setSelCust]=useState(null);
  const [search,setSearch]=useState("");
  const [showPayModal,setShowPayModal]=useState(false);
  const [payAmt,setPayAmt]=useState("");
  const [payNote,setPayNote]=useState("");

  // Build ledger entries per customer
  function getCustLedger(c){
    const invs=invoices.filter(i=>i.customer?.mobile===c.mobile&&i.customer?.mobile);
    const balance=invs.filter(i=>i.status!=="paid").reduce((s,i)=>s+(i.grandTotal-(i.paidAmt||0)),0);
    return{invs,balance};
  }

  const custWithDues=customers
    .map(c=>({...c,...getCustLedger(c)}))
    .filter(c=>c.invs.length>0||c.balance>0)
    .filter(c=>!search||c.name.toLowerCase().includes(search.toLowerCase())||c.mobile.includes(search))
    .sort((a,b)=>b.balance-a.balance);

  const totalDue=custWithDues.reduce((s,c)=>s+c.balance,0);

  function recordPayment(){
    if(!payAmt||+payAmt<=0){alert("Enter payment amount.");return;}
    const amt=+payAmt;
    // Apply payment to oldest unpaid invoices first
    let remaining=amt;
    const updated=invoices.map(inv=>{
      if(inv.customer?.mobile!==selCust.mobile||remaining<=0)return inv;
      if(inv.status==="paid")return inv;
      const due=inv.grandTotal-(inv.paidAmt||0);
      if(due<=0)return inv;
      if(remaining>=due){remaining-=due;return{...inv,status:"paid",paidAmt:inv.grandTotal};}
      else{const paid=(inv.paidAmt||0)+remaining;remaining=0;return{...inv,status:"partial",paidAmt:paid};}
    });
    saveInvoices(updated);
    setShowPayModal(false);setPayAmt("");setPayNote("");
    alert(`✅ Payment of ₹${fmt(amt)} recorded for ${selCust.name}`);
    setSelCust(null);
  }

  if(selCust){
    const{invs,balance}=getCustLedger(selCust);
    return(
      <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"16px 14px 80px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <button onClick={()=>setSelCust(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:C.navy}}>←</button>
          <div>
            <h2 style={{fontSize:17,fontWeight:700,color:C.text}}>{selCust.name}</h2>
            <div style={{fontSize:12,color:C.muted}}>📞 {selCust.mobile}</div>
          </div>
          <div style={{marginLeft:"auto"}}>
            {balance>0&&<Btn small variant="green" onClick={()=>setShowPayModal(true)}>💰 Collect</Btn>}
          </div>
        </div>

        {/* Balance card */}
        <div style={{background:balance>0?`linear-gradient(135deg,${C.red},#ef4444)`:`linear-gradient(135deg,${C.green},#10b981)`,borderRadius:14,padding:"16px 18px",marginBottom:14,boxShadow:"0 4px 16px rgba(0,0,0,0.15)"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",fontWeight:600,letterSpacing:1,marginBottom:4}}>OUTSTANDING BALANCE</div>
          <div style={{fontSize:28,fontWeight:800,color:"#fff"}}>₹{fmt(balance)}</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginTop:2}}>{invs.length} invoices total</div>
        </div>

        {/* WhatsApp reminder */}
        {balance>0&&(
          <Card style={{padding:"12px 14px",marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📱 Send Reminder</div>
            <button onClick={()=>{const msg=`Namaste ${selCust.name} ji! 🙏\n\n${SHOP.name} se aapka outstanding balance hai:\n*₹${fmt(balance)}*\n\nKripya jald se jald bhugtan karein.\n\nDhanyawad! 🙏`;window.open(`https://wa.me/${selCust.mobile?.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`,"_blank");}}
              style={{width:"100%",background:"#25D366",border:"none",borderRadius:8,padding:"10px",cursor:"pointer",color:"#fff",fontWeight:700,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              💬 Send WhatsApp Reminder
            </button>
          </Card>
        )}

        {/* Invoice history */}
        <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:C.navy}}>Invoice History</div>
        {invs.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(inv=>(
          <Card key={inv.id} style={{padding:"12px 14px",marginBottom:8,borderLeft:`4px solid ${inv.status==="paid"?C.green:inv.status==="partial"?C.saffron:C.red}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:600,fontSize:13,color:C.navy}}>{inv.no}</div>
                <div style={{fontSize:11,color:C.muted}}>{new Date(inv.date).toLocaleDateString("en-IN")}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:700,fontSize:14}}>₹{fmt(inv.grandTotal)}</div>
                <StatusBadge status={inv.status}/>
              </div>
            </div>
            {inv.status==="partial"&&<div style={{fontSize:11,color:C.saffron,marginTop:4}}>Paid: ₹{fmt(inv.paidAmt||0)} | Due: ₹{fmt(inv.grandTotal-(inv.paidAmt||0))}</div>}
          </Card>
        ))}

        {showPayModal&&(
          <Modal title="💰 Record Payment" onClose={()=>setShowPayModal(false)}>
            <div style={{marginBottom:4,fontSize:13,color:C.muted}}>Outstanding: <b style={{color:C.red}}>₹{fmt(balance)}</b></div>
            <div style={{marginBottom:12}}><Label>Amount Received ₹</Label><Input value={payAmt} onChange={setPayAmt} type="number" placeholder="0" autoFocus/></div>
            <div style={{marginBottom:16}}><Label>Note (optional)</Label><Input value={payNote} onChange={setPayNote} placeholder="e.g. Cash payment"/></div>
            <div style={{display:"flex",gap:8}}>
              <Btn variant="ghost" onClick={()=>setShowPayModal(false)} style={{flex:1}}>Cancel</Btn>
              <Btn variant="green" onClick={recordPayment} style={{flex:1}}>✅ Record</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return(
    <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"16px 14px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <h2 style={{fontSize:18,fontWeight:700,color:C.text}}>📒 Khata / Ledger</h2>
      </div>

      {/* Total dues */}
      <div style={{background:`linear-gradient(135deg,${C.red},#ef4444)`,borderRadius:14,padding:"16px 18px",marginBottom:14,boxShadow:"0 4px 16px rgba(220,38,38,0.25)"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",fontWeight:600,letterSpacing:1,marginBottom:4}}>TOTAL OUTSTANDING DUES</div>
        <div style={{fontSize:28,fontWeight:800,color:"#fff"}}>₹{fmt(totalDue)}</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginTop:2}}>{custWithDues.filter(c=>c.balance>0).length} customers have dues</div>
      </div>

      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search customers…"
        style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",fontSize:13,outline:"none",background:"#fff",marginBottom:12}}/>

      {custWithDues.length===0
        ?<div style={{textAlign:"center",color:C.muted,padding:40}}>
            <div style={{fontSize:32,marginBottom:8}}>✅</div>
            <div style={{fontSize:13}}>No outstanding dues!</div>
          </div>
        :custWithDues.map(c=>(
          <Card key={c.id} style={{padding:"12px 14px",marginBottom:8,cursor:"pointer",borderLeft:`4px solid ${c.balance>0?C.red:C.green}`}} onClick={()=>setSelCust(c)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{c.name}</div>
                <div style={{fontSize:12,color:C.muted}}>📞 {c.mobile} • {c.invs.length} invoices</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:800,fontSize:15,color:c.balance>0?C.red:C.green}}>₹{fmt(c.balance)}</div>
                <div style={{fontSize:10,color:c.balance>0?C.red:C.green,fontWeight:600}}>{c.balance>0?"DUE":"CLEAR"}</div>
              </div>
            </div>
          </Card>
        ))
      }
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState("dashboard");
  const [invoices,setInvoices]=useState([]);
  const [products,setProducts]=useState(INIT_PRODUCTS);
  const [customers,setCustomers]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [viewInv,setViewInv]=useState(null);
  const [loaded,setLoaded]=useState(false);
  const [showAI,setShowAI]=useState(false);

  useEffect(()=>{
    try{
      const i=db.get("be2_inv");
      const p=db.get("be2_prod");
      const c=db.get("be2_cust");
      const e=db.get("be2_exp");
      if(i)setInvoices(i);
      if(p)setProducts(p);
      if(c)setCustomers(c);
      if(e)setExpenses(e);
    }catch{}
    setLoaded(true);
  },[]);

  const saveInv=d=>{setInvoices(d);db.set("be2_inv",d);};
  const saveProd=d=>{setProducts(d);db.set("be2_prod",d);};
  const saveCust=d=>{setCustomers(d);db.set("be2_cust",d);};
  const saveExp=d=>{setExpenses(d);db.set("be2_exp",d);};

  if(!loaded){
    return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.navy,flexDirection:"column",gap:12}}>
        <div style={{fontSize:48,filter:"drop-shadow(0 0 20px rgba(245,158,11,0.5))"}}>⚡</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.4)"}}>Loading…</div>
      </div>
    );
  }

  const lowCount=products.filter(p=>(p.stock||0)<10).length;
  const totalDue=customers.map(c=>{
    return invoices.filter(i=>i.customer?.mobile===c.mobile&&i.status!=="paid").reduce((s,i)=>s+(i.grandTotal-(i.paidAmt||0)),0);
  }).reduce((a,b)=>a+b,0);

  const NAV=[
    {id:"dashboard",icon:"📊",label:"Home"},
    {id:"new-invoice",icon:"➕",label:"Invoice"},
    {id:"invoices",icon:"🧾",label:"Bills"},
    {id:"khata",icon:"📒",label:"Khata"},
    {id:"stock",icon:"📦",label:"Stock"},
    {id:"expenses",icon:"💸",label:"Expense"},
    {id:"pnl",icon:"📈",label:"P&L"},
    {id:"settings",icon:"⚙️",label:"More"},
  ];

  const activeNav=view==="view-invoice"?"invoices":view==="products"?"settings":view==="customers"?"settings":view;

  return(
    <div id="app-shell" style={{display:"flex",flexDirection:"column",height:"100vh",background:C.bg,overflow:"hidden"}}>
      {/* Top bar */}
      <div style={{background:C.navy,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,paddingTop:`calc(10px + env(safe-area-inset-top))`}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>⚡</span>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:"#fff",lineHeight:1.2}}>Bharat Electricals</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{SHOP.city}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {lowCount>0&&<div style={{background:C.red,color:"#fff",borderRadius:12,padding:"2px 8px",fontSize:11,fontWeight:700}}>⚠️ {lowCount}</div>}
          {totalDue>0&&<div style={{background:C.saffron,color:"#fff",borderRadius:12,padding:"2px 8px",fontSize:11,fontWeight:700}}>₹{fmtI(Math.round(totalDue/1000))}k due</div>}
          <button onClick={()=>setShowAI(true)}
            style={{background:`linear-gradient(135deg, ${C.saffron}, ${C.saffronL})`,border:"none",borderRadius:20,padding:"6px 12px",cursor:"pointer",color:"#fff",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
            ✨ AI
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {view==="dashboard"&&<Dashboard invoices={invoices} products={products} customers={customers} expenses={expenses} setView={setView} setViewInv={setViewInv}/>}
        {view==="new-invoice"&&<NewInvoice invoices={invoices} products={products} customers={customers} saveInv={saveInv} saveProd={saveProd} saveCust={saveCust} setView={setView}/>}
        {view==="invoices"&&<Invoices invoices={invoices} saveInv={saveInv} setViewInv={setViewInv} setView={setView}/>}
        {view==="stock"&&<StockPage products={products} saveProd={saveProd}/>}
        {view==="products"&&<Products products={products} saveProd={saveProd}/>}
        {view==="customers"&&<Customers customers={customers} saveCust={saveCust} invoices={invoices}/>}
        {view==="khata"&&<KhataPage customers={customers} invoices={invoices} saveInvoices={saveInv}/>}
        {view==="expenses"&&<ExpensePage expenses={expenses} saveExpenses={saveExp}/>}
        {view==="pnl"&&<ProfitLoss invoices={invoices} products={products}/>}
        {view==="settings"&&<Settings invoices={invoices} products={products} customers={customers} expenses={expenses} saveInv={saveInv} saveProd={saveProd} saveCust={saveCust} setView={setView}/>}
        {view==="view-invoice"&&viewInv&&<ViewInvoice inv={viewInv} setView={setView} saveInv={saveInv} invoices={invoices}/>}
      </div>

      {/* Bottom Nav */}
      <div style={{background:"#fff",borderTop:`1px solid ${C.border}`,display:"flex",flexShrink:0,paddingBottom:`env(safe-area-inset-bottom)`,overflowX:"auto"}}>
        {NAV.map(n=>{
          const active=activeNav===n.id;
          const badge=n.id==="stock"&&lowCount>0?lowCount:n.id==="khata"&&totalDue>0?"!":null;
          return(
            <button key={n.id} onClick={()=>setView(n.id)}
              style={{flex:1,minWidth:44,padding:"8px 2px 6px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
              <span style={{fontSize:17,lineHeight:1}}>{n.icon}</span>
              <span style={{fontSize:9,fontWeight:active?700:400,color:active?C.saffron:C.muted,lineHeight:1,whiteSpace:"nowrap"}}>{n.label}</span>
              {active&&<div style={{position:"absolute",bottom:0,left:"20%",right:"20%",height:2,background:C.saffron,borderRadius:2}}/>}
              {badge&&<div style={{position:"absolute",top:4,right:"15%",background:C.red,color:"#fff",borderRadius:8,fontSize:9,padding:"1px 4px",fontWeight:700,lineHeight:1}}>{badge}</div>}
            </button>
          );
        })}
      </div>

      {/* AI Assistant */}
      {showAI&&<AIAssistant invoices={invoices} products={products} customers={customers} expenses={expenses} onClose={()=>setShowAI(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
